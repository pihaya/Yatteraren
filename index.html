<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#33483d"><title>株式会社 やってられん</title><style>:root{--paper:#e9d9b4;--ink:#302c24;--green:#344b3d;--red:#a44532}*{box-sizing:border-box}body{margin:0;background:#697365;color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}main{max-width:540px;min-height:100dvh;margin:auto;padding:22px 17px 45px;background:repeating-linear-gradient(0deg,#e9d9b4,#e9d9b4 3px,#e6d5af 4px);box-shadow:0 0 30px #26332988;position:relative;overflow:hidden}.stamp{border:3px double var(--red);color:var(--red);display:inline-block;padding:3px 10px;transform:rotate(-8deg);font-weight:900}header{text-align:center;border-bottom:5px double var(--ink);padding:10px 0 16px}h1{font-size:clamp(28px,8vw,43px);letter-spacing:.04em;margin:14px 0 4px}small{font-size:12px}.tagline{font-weight:700;font-size:13px}.scene{height:175px;background:#a7b3a1;border:5px solid #4a4c3c;position:relative;margin:20px 0 14px;overflow:hidden;background-image:linear-gradient(90deg,transparent 49%,#738b7d 50%,transparent 51%)}.sun{position:absolute;top:13px;right:22px;background:#e9dfab;border:3px solid #4c614e;border-radius:50%;width:62px;height:62px}.desk{position:absolute;bottom:0;width:100%;height:48px;background:#74513d;border-top:9px solid #50382c}.boss{position:absolute;bottom:33px;left:calc(50% - 48px);width:96px;height:102px;transition:transform .25s}.head{position:absolute;left:20px;top:2px;width:56px;height:60px;background:#e6b68d;border:3px solid #382d2c;border-radius:44% 44% 46% 46%}.hair{position:absolute;top:-5px;left:8px;width:45px;height:17px;background:#35332f;border-radius:80% 80% 20% 20%}.eyes{position:absolute;top:30px;left:11px;font-weight:bold;letter-spacing:7px}.mouth{position:absolute;top:43px;left:26px}.body{position:absolute;top:59px;left:6px;width:84px;height:66px;background:#596c5b;border:3px solid #333;border-radius:18px 18px 0 0}.tie{position:absolute;top:63px;left:44px;background:#a83e34;width:9px;height:46px;clip-path:polygon(50% 0,100% 20%,65% 100%,25% 100%,0 20%)}.speech{position:absolute;top:13px;left:12px;background:#f3e9d2;border:2px solid #3c3c33;padding:8px;font-size:12px;font-weight:bold;max-width:125px;transform:rotate(-4deg)}.panel{border:3px solid #4a493a;background:#f2e7ce;padding:15px;box-shadow:5px 5px 0 #a99b7c}label{display:block;font-weight:900;margin-bottom:9px}textarea{width:100%;min-height:115px;border:2px solid #6c6658;background:#fffaf0;padding:12px;font:16px/1.6 inherit;resize:vertical;border-radius:0}button{font:900 17px inherit;cursor:pointer;border:3px solid #2c322d;border-radius:3px;box-shadow:3px 4px 0 #2c322d;touch-action:manipulation}button:active{transform:translate(2px,3px);box-shadow:1px 1px 0 #2c322d}.primary{display:block;width:100%;background:#aa4935;color:#fff8df;padding:15px;margin:14px 0}.secondary{background:#e3ce99;padding:11px 14px;margin:8px 5px 0 0;font-size:14px}.status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.meter{border:2px solid #4e4d40;background:#f3e9d3;padding:10px;text-align:center;font-size:12px;font-weight:bold}.meter strong{display:block;font-size:25px;color:#a44532;margin-top:5px}.result{display:none;text-align:center;border:4px double #a44532;padding:18px 10px;margin:18px 0;background:#fff0ce;animation:pop .5s ease}.result.show{display:block}.result h2{margin:5px;font-size:23px}.result p{line-height:1.7}.foot{font-size:11px;line-height:1.7;margin-top:22px;text-align:center}.shake{animation:shake .5s}.confetti{position:absolute;width:9px;height:15px;pointer-events:none;animation:fall 1.5s ease-in forwards}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px) rotate(-7deg)}75%{transform:translateX(12px) rotate(7deg)}}@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}@keyframes fall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(520px) rotate(620deg);opacity:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><main id="app"><header><span class="stamp">極秘・社外秘（という設定）</span><h1>株式会社<br>やってられん</h1><div class="tagline">〜皆様の我慢により、本日も平常運転〜</div></header><div class="scene"><div class="sun"></div><div class="speech" id="speech">検討は前向きに<br>見送ります。</div><div class="boss" id="boss"><div class="body"></div><div class="tie"></div><div class="head"><div class="hair"></div><div class="eyes">・ ・</div><div class="mouth">へ</div></div></div><div class="desk"></div></div><section class="panel"><label for="vent">本日の「やってられん」を記入せよ。</label><textarea id="vent" maxlength="1000" placeholder="例：会議のための会議が開催された……（個人名・利用者情報は書かないでね）"></textarea><button class="primary" id="shred">📄 不満を豪快に粉砕する！</button><button class="secondary" id="award">🏆 理不尽表彰式</button><button class="secondary" id="quote">📢 社長の迷言</button><button class="secondary" id="sound">🔊 効果音 ON</button></section><div class="result" id="result" role="status" aria-live="polite"><h2 id="resultTitle"></h2><p id="resultText"></p></div><div class="status"><div class="meter">社員のスッキリ度<strong id="happy">0</strong></div><div class="meter">会社の改善度<strong>0%</strong></div></div><p class="foot">これは架空の会社を舞台にしたジョークアプリです。<br>入力内容は送信・保存されず、処理後に消去されます。<br>実在の人物の氏名、患者・利用者情報、機密情報は入力しないでください。</p></main><script>let happy=0,sound=true,ctx;const $=id=>document.getElementById(id);const lines=['貴重なご意見として、虚空に保存いたしました。','本件は全社一丸となって見なかったことにします。','担当部署（存在しない）にて厳正に処理しました。','会議を重ねた結果、会議を増やすことにしました。','改善の必要性について検討する必要性を確認しました。'];const awards=['栄えある「説明不足金賞」受賞！','「責任の所在が行方不明で賞」受賞！','「会議だけは皆勤賞」受賞！','「現場の声は風の音で賞」受賞！'];const quotes=['検討は前向きに見送ります。','風通しの良さには自信があります。窓は開きません。','社員は宝です。金庫にしまっておきます。','問題があるなら、問題を報告しないでください。'];function beep(){if(!sound)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(520,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(110,ctx.currentTime+.25);g.gain.setValueAtTime(.09,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3)}catch(e){}}function show(title,msg){$('resultTitle').textContent=title;$('resultText').textContent=msg;$('result').classList.remove('show');void $('result').offsetWidth;$('result').classList.add('show');beep()}function confetti(){const root=$('app');for(let i=0;i<36;i++){let el=document.createElement('span');el.className='confetti';el.style.left=Math.random()*100+'%';el.style.top='0';el.style.background=['#a44532','#d7b25d','#4e7155','#f8edcd'][i%4];el.style.animationDelay=Math.random()*.4+'s';root.appendChild(el);setTimeout(()=>el.remove(),2000)}}$('shred').onclick=()=>{if(!$('vent').value.trim()){show('未提出','まずは愚痴を一言、記入してください。');return} $('vent').value='';happy+=10;$('happy').textContent=happy+'pt';$('boss').classList.remove('shake');void $('boss').offsetWidth;$('boss').classList.add('shake');show('粉砕完了！',lines[Math.floor(Math.random()*lines.length)]);confetti()};$('award').onclick=()=>show('辞令・表彰状',awards[Math.floor(Math.random()*awards.length)]);$('quote').onclick=()=>{let q=quotes[Math.floor(Math.random()*quotes.length)];$('speech').textContent=q;show('本日のありがたい迷言',q)};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 効果音 ON':'🔇 効果音 OFF';if(sound)beep()};</script></body></html>
